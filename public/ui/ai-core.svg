<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-labelledby="t d">
<title id="t">AI 智慧核心動畫</title><desc id="d">會漂浮、旋轉、脈動的藍色人工智慧核心與全息軌道</desc>
<defs>
 <radialGradient id="orb" cx="38%" cy="28%" r="72%"><stop stop-color="#d9fbff"/><stop offset=".2" stop-color="#39ddff"/><stop offset=".58" stop-color="#087cf2"/><stop offset="1" stop-color="#063fb7"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcff"/><stop offset=".42" stop-color="#5dbdff"/><stop offset=".75" stop-color="#176ee8"/><stop offset="1" stop-color="#d7f6ff"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<ellipse cx="210" cy="278" rx="142" ry="22" fill="#168cff" opacity=".14">
 <animate attributeName="rx" values="132;148;132" dur="4s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values=".10;.2;.10" dur="4s" repeatCount="indefinite"/>
</ellipse>

<g transform="translate(210 154)">
 <g fill="none" stroke="#60cfff" opacity=".68" filter="url(#softGlow)">
  <ellipse rx="170" ry="92" stroke-dasharray="10 12">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
   <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="116" ry="145" transform="rotate(62)" stroke-dasharray="7 14">
   <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="132" ry="58" transform="rotate(-19)" stroke-dasharray="4 10">
   <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
  </ellipse>
 </g>
</g>

<g id="floating-core">
 <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.8s" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" repeatCount="indefinite"/>
 <g filter="url(#glow)">
  <circle cx="210" cy="150" r="79" fill="url(#orb)" stroke="#d9fbff" stroke-width="5">
   <animate attributeName="r" values="77;82;77" dur="3s" repeatCount="indefinite"/>
   <animate attributeName="stroke-opacity" values=".75;1;.75" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="188" cy="124" r="26" fill="#fff" opacity=".16">
   <animate attributeName="opacity" values=".10;.28;.10" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="150" r="92" fill="none" stroke="#a7efff" stroke-width="2" opacity=".2">
   <animate attributeName="r" values="84;103" dur="2.2s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values=".55;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="210" y="169" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800">AI
   <animate attributeName="opacity" values=".9;1;.9" dur="2s" repeatCount="indefinite"/>
  </text>
 </g>
</g>

<g stroke="#d8f8ff" fill="#0b8fff" filter="url(#softGlow)">
 <circle r="7"><animateMotion dur="7s" repeatCount="indefinite" path="M73 91 C140 20 295 18 338 66 C375 110 384 180 361 203 C300 260 155 265 93 219 C45 184 39 126 73 91Z"/></circle>
 <circle r="6"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M338 66 C375 110 384 180 361 203 C300 260 155 265 93 219 C45 184 39 126 73 91 C140 20 295 18 338 66Z"/></circle>
 <circle r="5"><animateMotion dur="5.5s" begin="-1s" repeatCount="indefinite" path="M93 219 C155 265 300 260 361 203 C384 180 375 110 338 66 C295 18 140 20 73 91 C39 126 45 184 93 219Z"/></circle>
</g>

<g>
 <ellipse cx="210" cy="254" rx="111" ry="27" fill="#167cf0" opacity=".28"><animate attributeName="opacity" values=".18;.36;.18" dur="3s" repeatCount="indefinite"/></ellipse>
 <path d="M92 247 210 210l118 37-118 42Z" fill="url(#metal)" opacity=".72"/>
 <ellipse cx="210" cy="233" rx="82" ry="22" fill="#eaffff" stroke="#40b8ff" stroke-width="3">
  <animate attributeName="stroke-width" values="2.5;5;2.5" dur="2.5s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse cx="210" cy="233" rx="58" ry="14" fill="#147bea" opacity=".5">
  <animate attributeName="rx" values="54;62;54" dur="2.5s" repeatCount="indefinite"/>
 </ellipse>
</g>
</svg>
